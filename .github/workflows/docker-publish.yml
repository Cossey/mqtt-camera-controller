name: Publish Docker Image

# Manual only: builds the image and pushes it to Docker Hub.
#
# Required repository configuration (Settings > Secrets and variables > Actions):
#   Variables:
#     DOCKERHUB_USERNAME  Docker Hub namespace/username that owns the repository
#     DOCKER_IMAGE_NAME   image name (optional, defaults to mqtt-camera-controller)
#   Secrets:
#     DOCKERHUB_USERNAME  Docker Hub username
#     DOCKERHUB_TOKEN     Docker Hub access token (Account > Personal access tokens)
#
# Tag strategy is fixed: 'latest' plus the short commit SHA, so every dispatch is
# recoverable and 'latest' always points at the most recent successful publish.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (blank = linux/amd64 only)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME || 'mqtt-camera-controller' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Docker Hub configuration
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${DOCKERHUB_USERNAME_VAR:-}" ]; then
            echo "::error::Repository variable DOCKERHUB_USERNAME is not set (Settings > Secrets and variables > Actions > Variables)."
            missing=1
          fi
          if [ -z "${DOCKERHUB_USERNAME_SECRET:-}" ] || [ -z "${DOCKERHUB_TOKEN_SECRET:-}" ]; then
            echo "::error::Secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must both be set (Settings > Secrets and variables > Actions > Secrets)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Publishing to docker.io/$DOCKERHUB_USERNAME_VAR/$IMAGE_NAME"
        env:
          DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_USERNAME_SECRET: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN_SECRET: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          set -euo pipefail
          short_sha="$(git rev-parse --short HEAD)"
          image="docker.io/$DOCKERHUB_USERNAME_VAR/$IMAGE_NAME"
          {
            echo "image=${image}"
            echo "version_tags=${image}:latest,${image}:${short_sha}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

          if [ -n "${PLATFORMS_INPUT:-}" ]; then
            echo "platforms=${PLATFORMS_INPUT}" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi
        env:
          DOCKERHUB_USERNAME_VAR: ${{ vars.DOCKERHUB_USERNAME }}
          PLATFORMS_INPUT: ${{ inputs.platforms }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          platforms: ${{ steps.meta.outputs.platforms }}
          tags: ${{ steps.meta.outputs.version_tags }}
          labels: |
            org.opencontainers.image.title=mqtt-camera-controller
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          builder: ${{ steps.buildx.outputs.name }}

      - name: Summarize published tags
        run: |
          echo "### Docker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.meta.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.meta.outputs.short_sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: \`${{ steps.meta.outputs.platforms }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.meta.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"